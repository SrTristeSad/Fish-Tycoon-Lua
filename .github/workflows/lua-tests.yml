name: Testes Lua
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar interpretador Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Executar suites de teste
        run: |
          set -eu
          for script in tests/*.lua; do
            echo "Testando $script"
            lua5.4 "$script"
          done
